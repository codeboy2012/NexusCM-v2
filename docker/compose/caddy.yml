services:
  caddy:
    image: caddy:latest
    container_name: nexuscm-caddy

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../../configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - frontend

    security_opt:
      - no-new-privileges:true
